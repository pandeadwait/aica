services:
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    container_name: tax-assistant-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  llm:
    build:
      context: ./llm
      dockerfile: Dockerfile
    container_name: tax-assistant-llm
    env_file:
      - .env
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OLLAMA_PULL_ON_START: ${OLLAMA_PULL_ON_START}
      TZ: ${TZ}
    ports:
      - "${OLLAMA_PORT}:11434"
    volumes:
      - llm_model_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:11434/api/tags >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tax-assistant-backend
    env_file:
      - .env
    environment:
      APP_ENV: container
      RUN_MIGRATIONS_ON_START: "true"
      TZ: ${TZ}
      APP_DOCUMENTS_DIR: ${APP_DOCUMENTS_DIR}
      APP_ARTIFACTS_DIR: ${APP_ARTIFACTS_DIR}
      APP_TEMP_DIR: ${APP_TEMP_DIR}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LLM_BASE_URL: http://llm:11434
      LLM_MODEL: ${OLLAMA_MODEL}
    ports:
      - "${BACKEND_PORT}:8000"
    volumes:
      - documents_data:${APP_DOCUMENTS_DIR}
      - artifacts_data:${APP_ARTIFACTS_DIR}
      - app_temp_data:${APP_TEMP_DIR}
    depends_on:
      postgres:
        condition: service_healthy
      llm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: tax-assistant-worker
    env_file:
      - .env
    environment:
      APP_ENV: container
      TZ: ${TZ}
      APP_DOCUMENTS_DIR: ${APP_DOCUMENTS_DIR}
      APP_ARTIFACTS_DIR: ${APP_ARTIFACTS_DIR}
      APP_TEMP_DIR: ${APP_TEMP_DIR}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LLM_BASE_URL: http://llm:11434
      LLM_MODEL: ${OLLAMA_MODEL}
    volumes:
      - documents_data:${APP_DOCUMENTS_DIR}
      - artifacts_data:${APP_ARTIFACTS_DIR}
      - app_temp_data:${APP_TEMP_DIR}
    depends_on:
      postgres:
        condition: service_healthy
      llm:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tax-assistant-frontend
    environment:
      TZ: ${TZ}
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  documents_data:
  artifacts_data:
  llm_model_data:
  app_temp_data:
